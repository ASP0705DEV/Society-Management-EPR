name: AI Smartgate Estate OS CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck TypeScript Code
        run: npm run typecheck

      - name: Run Vitest Unit Test Suite
        run: npm test

      - name: Verify Frontend Production Build
        run: npm run build

  docker-build-check:
    name: Docker Container Validation
    needs: validate-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: false
          tags: smartgate-server:latest

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: false
          tags: smartgate-client:latest
