<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shield Primary Gradient -->
    <linearGradient id="smartGateShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0072f5" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Inner Tower Gradient -->
    <linearGradient id="smartGateTowers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Rounded Soft Shield Container -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#smartGateShield)" />

  <!-- Subtle Inner Highlight Rim -->
  <rect x="3" y="3" width="42" height="42" rx="13" fill="none" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" />

  <!-- Modern Architectural Silhouette - Central High-Rise Tower -->
  <rect x="18" y="12" width="12" height="24" rx="2.5" fill="url(#smartGateTowers)" />

  <!-- Left Stepped Wing Tower -->
  <rect x="10" y="18" width="6" height="18" rx="2" fill="#ffffff" opacity="0.85" />

  <!-- Right Stepped Wing Tower -->
  <rect x="32" y="18" width="6" height="18" rx="2" fill="#ffffff" opacity="0.85" />

  <!-- Center Tower Windows Grid -->
  <rect x="20.5" y="15" width="3" height="3" rx="0.7" fill="#0284c7" />
  <rect x="24.5" y="15" width="3" height="3" rx="0.7" fill="#0284c7" />
  <rect x="20.5" y="20" width="3" height="3" rx="0.7" fill="#0284c7" />
  <rect x="24.5" y="20" width="3" height="3" rx="0.7" fill="#0284c7" />
  <rect x="20.5" y="25" width="3" height="3" rx="0.7" fill="#0284c7" />
  <rect x="24.5" y="25" width="3" height="3" rx="0.7" fill="#0284c7" />

  <!-- Wing Windows -->
  <rect x="11.5" y="21" width="3" height="2.5" rx="0.6" fill="#0072f5" opacity="0.85" />
  <rect x="11.5" y="26" width="3" height="2.5" rx="0.6" fill="#0072f5" opacity="0.85" />
  <rect x="33.5" y="21" width="3" height="2.5" rx="0.6" fill="#0072f5" opacity="0.85" />
  <rect x="33.5" y="26" width="3" height="2.5" rx="0.6" fill="#0072f5" opacity="0.85" />

  <!-- SmartGate Portal Arch Barrier -->
  <path d="M8 38 C14 34 34 34 40 38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.95" />

  <!-- AI Pulse Sensor Light at Apex -->
  <circle cx="24" cy="8.5" r="2.2" fill="#22c55e" />
  <circle cx="24" cy="8.5" r="3.8" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.6" />
  <line x1="24" y1="10.8" x2="24" y2="12" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
</svg>
