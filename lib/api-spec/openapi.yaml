openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: passes
    description: Resident access pass operations
  - name: gate
    description: Gate validation and sync operations
  - name: dashboard
    description: Dashboard summary and event operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /passes:
    get:
      operationId: listPasses
      tags: [passes]
      summary: List access passes
      responses:
        "200":
          description: Access passes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessPass"
    post:
      operationId: createPass
      tags: [passes]
      summary: Create a signed access pass
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessPassInput"
      responses:
        "201":
          description: Created access pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPass"
  /passes/{id}/revoke:
    post:
      operationId: revokePass
      tags: [passes]
      summary: Revoke an access pass
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked access pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPass"
        "404":
          description: Pass not found
  /gate/public-key:
    get:
      operationId: getGatePublicKey
      tags: [gate]
      summary: Get the public key used by gate devices
      responses:
        "200":
          description: Public verification key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKey"
  /sync/revocations:
    get:
      operationId: listRevocations
      tags: [gate]
      summary: Get revoked pass IDs
      responses:
        "200":
          description: Revocation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Revocation"
  /sync/events:
    post:
      operationId: syncEvents
      tags: [gate]
      summary: Upload gate validation events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncEventsInput"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get resident dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/events:
    get:
      operationId: listGateEvents
      tags: [dashboard]
      summary: List recent gate events
      responses:
        "200":
          description: Recent gate events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GateEvent"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccessPass:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [guest, delivery]
        label:
          type: string
        issuedBy:
          type: string
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, used, revoked, expired]
        token:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, type, label, issuedBy, validFrom, validTo, status, token, createdAt]
    AccessPassInput:
      type: object
      properties:
        type:
          type: string
          enum: [guest, delivery]
        label:
          type: string
          minLength: 1
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
      required: [type, label, validFrom, validTo]
    PublicKey:
      type: object
      properties:
        kid:
          type: string
        publicKey:
          type: string
        fetchedAt:
          type: string
          format: date-time
      required: [kid, publicKey, fetchedAt]
    Revocation:
      type: object
      properties:
        tokenId:
          type: string
        revokedAt:
          type: string
      required: [tokenId, revokedAt]
    GateEvent:
      type: object
      properties:
        id:
          type: string
        tokenId:
          type: string
        passLabel:
          type: string
        decision:
          type: string
          enum: [granted, denied]
        reason:
          type: string
        gate:
          type: string
        occurredAt:
          type: string
        synced:
          type: boolean
      required: [id, tokenId, passLabel, decision, reason, gate, occurredAt, synced]
    SyncEventsInput:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/GateEvent"
      required: [events]
    SyncResult:
      type: object
      properties:
        accepted:
          type: number
        syncedAt:
          type: string
      required: [accepted, syncedAt]
    DashboardSummary:
      type: object
      properties:
        activePasses:
          type: number
        entriesToday:
          type: number
        revokedPendingSync:
          type: number
        gateStatus:
          type: string
          enum: [online, offline]
        lastSyncAt:
          type: ["string", "null"]
      required: [activePasses, entriesToday, revokedPendingSync, gateStatus, lastSyncAt]

